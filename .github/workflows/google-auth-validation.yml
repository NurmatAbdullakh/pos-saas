name: Google authentication validation

on:
  push:
    branches:
      - spec/google-auth-demo
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/google-auth-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/web/**"

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install --no-audit --no-fund
      - name: Typecheck API
        working-directory: apps/api
        run: npm run typecheck
      - name: Build API
        working-directory: apps/api
        run: npm run build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Build web
        working-directory: apps/web
        run: npm run build
